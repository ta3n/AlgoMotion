server {
    listen       80;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    include       /etc/nginx/mime.types;
    types {
        application/wasm wasm;
    }

    # Serve the .gz files Blazor already publishes alongside each asset
    # instead of shipping the uncompressed originals (built into stock nginx,
    # no extra module needed). Falls back to on-the-fly gzip for anything
    # without a precompressed sidecar.
    gzip_static  on;
    gzip         on;
    gzip_vary    on;
    gzip_types   application/wasm application/octet-stream text/javascript
                 application/javascript text/css application/json;

    # Blazor WASM is a client-side SPA: fall back to index.html
    # so client-side routes don't 404 on refresh.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache hashed/static assets aggressively.
    location ~* \.(?:css|js|wasm|dll|json|woff2?|png|jpg|jpeg|svg|ico)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
    }
}
